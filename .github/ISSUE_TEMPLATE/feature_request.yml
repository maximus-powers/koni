name: Feature request
description: Propose a focused improvement to Köni
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should Köni solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior and acceptance criteria.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Likely layer
      options:
        - Generic Core
        - Project profile or schema
        - Pi agent or skill
        - TUI, monitor, or CLI
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Describe effects on configuration, durable state, Git topology, or existing runs.
