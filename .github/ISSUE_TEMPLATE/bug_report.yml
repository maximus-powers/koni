name: Bug report
description: Report reproducible incorrect behavior in Köni
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private prompts, proprietary code, and other sensitive data.
  - type: input
    id: version
    attributes:
      label: Köni version
      description: Provide the output of `koni --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Provide the operating system, version, and architecture.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Initialization or migration
        - Configuration or validation
        - Planning or questions
        - TUI or monitor
        - Graph or ticket compilation
        - Agent or process runtime
        - Git, worktree, or integration
        - Receipts, recovery, or deletion
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sanitized sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed credentials and private repository content.
          required: true
        - label: This report is not a security vulnerability.
          required: true
