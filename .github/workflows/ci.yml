name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Pin runtime build tools
        shell: bash
        run: |
          echo "KONI_PINNED_NODE_PATH=$(node -p 'require("fs").realpathSync(process.execPath)')" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
            echo "KONI_PINNED_BWRAP_PATH=$(readlink -f "$(command -v bwrap)")" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        if: matrix.os == 'macos-latest'
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --workspace --locked
      - name: Unsupported-platform safety
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test -p koni-core --test research_profile
          automatic_gate_compile_fails_closed_without_supported_os_sandbox --locked
      - name: Brand audit
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check-brand.sh

  pi-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/pi-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: runtime/pi-host/package-lock.json
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run check
      - name: Verify production dependency SBOM
        shell: bash
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx > dist/koni-pi-host.cdx.json
          node -e 'const b=require("./dist/koni-pi-host.cdx.json"); if (b.bomFormat !== "CycloneDX" || !b.components?.some((c) => c.name === "@earendil-works/pi-agent-core" && c.version === "0.80.7") || !b.components?.some((c) => c.name === "@earendil-works/pi-ai" && c.version === "0.80.7")) process.exit(1)'

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew style packaging/homebrew/koni.rb
