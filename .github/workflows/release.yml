name: release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Verify tag matches Core
        run:
          node -e 'const v=require("./packages/core/package.json").version; if
          (process.env.GITHUB_REF_NAME !== `v${v}`) process.exit(1)'
      - run: npm run check
      - name: Build and audit the tested Pi host boundary
        run: |
          npm run build
          node --test scripts/pi-host-boundary.test.mjs
          node scripts/check-pi-host-boundary.mjs --output koni-pi-host-compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: validated-source
          path: koni-pi-host-compatibility.json

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - run: npm run build
      - name: Pack the coarse Pi package system
        run: |
          mkdir -p release
          npm pack --workspace @koni/coding-profile --pack-destination release
          npm pack --workspace @koni/research-profile --pack-destination release
          npm pack --workspace @koni/core --pack-destination release
          cp LICENSE release/Koni-LICENSE
          test "$(find release -maxdepth 1 -name '*.tgz' | wc -l)" -eq 3
      - name: Smoke the exact archives through disposable stock Pi
        env:
          KONI_PACKAGE_ARCHIVES_DIR: ${{ github.workspace }}/release
        run: node --test scripts/pi-package-smoke.test.mjs
      - name: Generate the exact Koni-owned shipping SBOM
        run: |
          closure="$(mktemp -d)"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({name:"koni-shipping-closure",version:"1.0.0",private:true})+"\n")' "$closure/package.json"
          npm install --prefix "$closure" --save-exact --legacy-peer-deps --ignore-scripts --no-audit --no-fund release/*.tgz
          npm audit --prefix "$closure" --omit=dev --audit-level=high
          npm sbom --prefix "$closure" --omit=dev --sbom-format cyclonedx > release/koni-shipping.cdx.json
          node - <<'NODE'
          const bom = require("./release/koni-shipping.cdx.json");
          const identity = (component) => component.group
            ? `${component.group.startsWith("@") ? "" : "@"}${component.group}/${component.name}`
            : component.name;
          const actual = new Map((bom.components ?? []).map((component) => [identity(component), component.version]));
          const expected = new Map([
            ["@koni/core", require("./packages/core/package.json").version],
            ["@koni/coding-profile", require("./packages/coding-profile/package.json").version],
            ["@koni/research-profile", require("./packages/research-profile/package.json").version],
            ["semver", "7.8.5"],
            ["yaml", "2.9.0"],
          ]);
          if (bom.bomFormat !== "CycloneDX" || actual.size !== expected.size) throw new Error("unexpected shipping SBOM closure");
          for (const [name, version] of expected) {
            if (actual.get(name) !== version) throw new Error(`shipping SBOM has ${name}@${actual.get(name) ?? "missing"}; expected ${version}`);
          }
          for (const name of actual.keys()) {
            if (name.startsWith("@earendil-works/pi-") || name === "typebox") throw new Error(`shipping SBOM contains host peer ${name}`);
          }
          NODE
          node -e 'require("node:fs").writeFileSync("release/koni-pi-host-compatibility.json", JSON.stringify({protocol:"koni.pi-host-compatibility.v1",pi:"0.80.10",typebox:"1.1.38",core_api:require("./packages/core/package.json").version},null,2)+"\n")'
          (cd release && sha256sum -- *.tgz *.json > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tgz
            release/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: pi-packages
          path: release/*

  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.13.0
      - uses: actions/download-artifact@v4
        with:
          name: pi-packages
          path: release
      - name: Publish the exact attested package archives with provenance
        shell: bash
        run: |
          publish_exact() {
            local archive="$1"
            local manifest name version local_integrity registry_integrity
            manifest="$(tar -xOf "$archive" package/package.json)"
            name="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.name)' "$manifest")"
            version="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.version)' "$manifest")"
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            if registry_integrity="$(npm view "${name}@${version}" dist.integrity 2>/dev/null)"; then
              if [[ -z "$registry_integrity" || "$registry_integrity" != "$local_integrity" ]]; then
                echo "Registry payload mismatch for immutable ${name}@${version}." >&2
                echo "expected ${local_integrity}" >&2
                echo "found    ${registry_integrity:-<missing integrity>}" >&2
                exit 1
              fi
              echo "Verified existing ${name}@${version} against the attested archive."
            else
              npm publish "$archive" --access public --provenance
            fi
          }
          shopt -s nullglob
          archives=(release/*.tgz)
          test "${#archives[@]}" -eq 3
          core_archive=""
          coding_archive=""
          research_archive=""
          for archive in "${archives[@]}"; do
            manifest="$(tar -xOf "$archive" package/package.json)"
            name="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.name)' "$manifest")"
            case "$name" in
              @koni/core)
                test -z "$core_archive"
                core_archive="$archive"
                ;;
              @koni/coding-profile)
                test -z "$coding_archive"
                coding_archive="$archive"
                ;;
              @koni/research-profile)
                test -z "$research_archive"
                research_archive="$archive"
                ;;
              *)
                echo "Unexpected release package identity: $name" >&2
                exit 1
                ;;
            esac
          done
          test -n "$core_archive" && test -n "$coding_archive" && test -n "$research_archive"
          # Profiles first, then Core as the activation package. A retry is safe because
          # publish_exact authenticates any already-present immutable registry payload.
          for archive in "$coding_archive" "$research_archive" "$core_archive"; do
            publish_exact "$archive"
          done

  github-release:
    needs: [package, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish package archives and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag --repo
          "$GITHUB_REPOSITORY"
