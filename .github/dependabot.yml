version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    # Frozen parity-oracle dependencies move only through an explicit oracle recapture.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/apps/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
