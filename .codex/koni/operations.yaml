schema_version: "1.0"
module: {id: software.operations, version: 0.1.0}

operations:
  - id: architecture.objective.map
    operation: map-architecture
    stage: architecture
    target_types: [objective]
    workflow: architecture-map
    allowed_new_node_types: [system, interface, data_model, contract, flow]
    allowed_existing_node_types: [objective]
    review_contract: Architecture map is grounded in repository paths, boundaries, and end-to-end flows.
    output_contract: >-
      Systems linked directly to the objective; interfaces and data models linked transitively through valid system exposes/owns relationships; contracts and flows linked through their configured objective relations. Integration preserves every material direct-dependency boundary, shared boundary identity, and exact repository-relative owned path; it may omit or replace upstream evidence only when findings records a verified explicit contradiction.
    ranking_hints: [phase, objective-id]
  - id: contracts.system.specify
    operation: specify-contracts
    stage: contracts
    target_types: [system]
    workflow: contract-design
    allowed_new_node_types: [interface, data_model, contract, flow, decision]
    allowed_existing_node_types: [system]
    review_contract: Contracts name enforcement points, failure meanings, compatibility, and owners.
    output_contract: Explicit interface/data/behavioral contracts and any unresolved decisions.
    ranking_hints: [phase, system-id]
  - id: design.objective.plan-change
    operation: plan-change
    stage: design
    target_types: [objective]
    workflow: change-design
    allowed_new_node_types: [change, migration, risk, proof, decision]
    allowed_existing_node_types: [objective, system, interface, data_model, contract, flow]
    review_contract: >-
      Every delta has ownership, blast radius, dependencies, risks, and proof obligations. New implementation nodes use fresh IDs, preserve every existing node's identity and type, and link both sides of required objective/change relationships.
    output_contract: >-
      Add at least one fresh-ID change node with a bounded current-to-target plan, then link objective.realized_by to the change and change.realizes back to the objective. Each change carries exactly one focused red-to-green argv array with the executable and every argument as separate items; broader checks belong in proof nodes. Add only material migrations, risks, decisions, and proof nodes, with valid relationships to the affected architecture.
    ranking_hints: [phase, objective-id]
  - id: design.decision.resolve
    operation: resolve-decision
    stage: design
    target_types: [decision]
    workflow: decision-resolution
    allowed_existing_node_types: [decision]
    review_contract: Choice is explicit, alternatives are represented, rationale and reversibility are recorded, and only a passing bound review may accept the decision.
    output_contract: Accepted or rejected decision with rationale.
    review_effects:
      - id: accept-decision
        verdict: passed
        select: {node_types: [decision], predicate: {field: status, op: equals, value: open}}
        count: {exact: 1}
        preconditions:
          - {field: spec.choice, op: non_empty}
          - {field: spec.rationale, op: non_empty}
          - {field: spec.reversibility, op: non_empty}
        set: {status: accepted}
    ranking_hints: [phase, decision-id]
    single_flight_group: architecture-decisions
  - id: implementation.change.apply
    operation: implement-change
    stage: implementation
    target_types: [change]
    workflow: bounded-implementation
    allowed_existing_node_types: [change]
    review_contract: Patch stays inside owned paths, begins with a compiler-recorded expected-red test, preserves that test while implementing the smallest behavior delta, and ends with fresh green and typecheck receipts.
    output_contract: Red test readback, expected-red receipt, scoped implementation, green receipt, typecheck receipt, and explicit remaining proof boundary.
    ranking_hints: [phase, dependency-depth, change-id]
    checks: [focused-test, package-typecheck]
    review_effects:
      - id: accept-implemented-change
        verdict: passed
        select: {node_types: [change], predicate: {field: status, op: equals, value: planned}}
        count: {exact: 1}
        preconditions:
          - {field: spec.test_command, op: non_empty}
          - {field: spec.test_paths, op: non_empty}
          - {field: spec.test_layer, op: non_empty}
          - {field: spec.behavior_readback, op: non_empty}
          - {field: spec.expected_red_signal, op: non_empty}
        set: {status: implemented}
  - id: implementation.migration.apply
    operation: implement-migration
    stage: implementation
    target_types: [migration]
    workflow: bounded-implementation
    allowed_existing_node_types: [migration]
    review_contract: Forward, compatibility, data-safety, and rollback paths are implemented through the same compiler-recorded red-to-green proof boundary as ordinary changes.
    output_contract: Migration payload with expected-red, compatibility, green, typecheck, and rollback evidence.
    ranking_hints: [phase, migration-id]
    checks: [focused-test, package-typecheck]
    single_flight_group: migrations
    review_effects:
      - id: accept-completed-migration
        verdict: passed
        select: {node_types: [migration], predicate: {field: status, op: equals, value: planned}}
        count: {exact: 1}
        preconditions:
          - {field: spec.test_command, op: non_empty}
          - {field: spec.test_paths, op: non_empty}
          - {field: spec.behavior_readback, op: non_empty}
          - {field: spec.expected_red_signal, op: non_empty}
          - {field: spec.rollback_plan, op: non_empty}
        set: {status: complete}
  - id: assurance.proof.establish
    operation: establish-proof
    stage: assurance
    target_types: [proof]
    workflow: proof-execution
    allowed_existing_node_types: [proof]
    review_contract: Compiler-bound command receipt exercises the declared conditions and expected signal at the lowest sufficient layer, is fresh for current graph and filesystem inputs, and does not overclaim beyond spec.not_proven.
    output_contract: Semantic proof readback plus a fresh typed command receipt and evidence artifacts.
    ranking_hints: [phase, proof-id]
    checks: [proof-command]
    review_effects:
      - id: accept-passing-proof
        verdict: passed
        select: {node_types: [proof]}
        count: {exact: 1}
        preconditions:
          - {field: spec.command, op: non_empty}
          - {field: spec.conditions, op: non_empty}
          - {field: spec.expected_signal, op: non_empty}
          - {field: spec.why, op: non_empty}
        set: {status: passing}
  - id: assurance.integration.assess
    operation: assess-integration
    stage: assurance
    target_types: [objective, change]
    workflow: integration-assessment
    allowed_new_node_types: [risk, proof, change]
    allowed_existing_node_types: [objective, change, risk, proof]
    review_contract: Cross-change interactions, likely regressions, and remaining proof gaps are explicit.
    output_contract: Integration findings, remediation deltas, and proof coverage.
    ranking_hints: [phase, objective-id]
  - id: delivery.objective.prepare
    operation: prepare-delivery
    stage: delivery
    target_types: [objective]
    workflow: delivery-review
    allowed_new_node_types: [delivery]
    allowed_existing_node_types: [objective, change, migration, proof, risk, decision]
    review_contract: All included changes are reviewed, proofs current, and unresolved risks visible.
    output_contract: PR-ready delivery node and one reviewed integration commit per ticket.
    ranking_hints: [phase, objective-id]
    checks: [repo-lint]
    single_flight_group: delivery
    review_effects:
      - id: accept-pr-ready-delivery
        verdict: passed
        select: {node_types: [delivery], predicate: {field: status, op: equals, value: assembling}}
        count: {exact: 1}
        preconditions:
          - {field: spec.target_branch, op: non_empty}
          - {field: spec.summary, op: non_empty}
        set: {status: pr_ready}
  - id: integration.target.resolve-conflict
    operation: resolve-target-integration
    stage: integration
    target_types: []
    workflow: target-integration-conflict
    allowed_new_node_types: []
    allowed_existing_node_types: []
    review_contract: The target branch is integrated without discarding either side, the composed tree is verified, and no semantic graph state is mutated.
    output_contract: A conflict-resolved product tree that preserves the run and target changes, with verification and review evidence.
    ranking_hints: [phase]
    single_flight_group: target-integration
