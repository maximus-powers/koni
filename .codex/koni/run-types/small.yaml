schema_version: "1.0"
id: small
title: Small
description: A focused vertical slice with one concise plan, compiler-enforced red-to-green work, and one worker at a time.
instructions:
  planning: |
    Ask no planning questions for this run type. Proceed conservatively, make
    reversible assumptions where necessary, and produce only the smallest
    implementation-ready vertical-slice plan. Name concrete owned paths, one
    exact focused-test argv, its expected red signal and behavior readback, the
    minimal production delta, and the verification still needed. Avoid broad
    repository surveys and speculative ticket decomposition.
planning:
  session_scope: run
  token_budget:
    metric: new_tokens
    limit: 250000
    synthesis_reserve: 50000
    on_exhausted: force_synthesis
profile:
  source: .codex/koni/profile.yaml
intake:
  fields:
    goal:
      label: Goal
      description: Describe the outcome Koni should deliver.
      type: text
      required: true
  order: [goal]
pipeline:
  stages:
    intake:
      kind: action
      title: Validate intake
      config: {compiler_owned: true, action: planning.intake}
    focused-plan:
      kind: planning
      title: Plan the focused slice
      config:
        persona: run-planner
        prompt: Produce one concise, implementation-ready vertical-slice plan with exact paths, the smallest red-to-green test command and expected failure, the minimal behavior delta, material risk, and completion evidence. Investigate only facts that can change those decisions.
    approval:
      kind: approval
      title: Approve the plan
    initialize:
      kind: initialize
      title: Initialize the run
    orchestrate:
      kind: orchestration
      title: Execute compiled work
    target-sync:
      kind: target_sync
      title: Synchronize the target branch
    report:
      kind: action
      title: Compile final report
      config: {action: report, automatic: true}
    promotion:
      kind: promotion
      title: Merge the completed run
  order: [intake, focused-plan, approval, initialize, orchestrate, target-sync, report, promotion]
questions:
  policy: autonomous
  default_scope: run
git:
  branch_template: "koni/runs/{{ run.slug }}-{{ run.short_id }}"
  ticket_branch_template: "koni/runs/{{ run.id }}/tickets/{{ ticket.id }}"
promotion:
  conflict_operation: resolve-target-integration
run_card:
  sections: [goal, pipeline, graph, tickets, checks, report]
agents:
  roles:
    planner: {model: gpt-5.6-terra, reasoning_effort: xhigh}
    lead: {model: gpt-5.6-terra, reasoning_effort: high}
    ticket_worker: {model: gpt-5.6-luna, reasoning_effort: medium}
    reviewer: {model: gpt-5.6-terra, reasoning_effort: max}
  personas: {}
orchestration:
  auto_start: true
  max_parallel: 1
  compile_action: compile
  lead_action: spawn-lead
  report_action: report
