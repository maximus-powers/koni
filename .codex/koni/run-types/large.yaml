schema_version: "1.0"
id: large
title: Large
description: A high-complexity change with separate architecture, risk, and verification plans plus independent review.
instructions:
  planning: |
    Treat all three planning stages as one shared planning session. In the
    architecture stage, begin with a lightweight decision scan and actively
    surface roughly three to six genuinely decision-bearing questions across
    one or more batches before deep investigation when their answers would
    change scope, architecture, safety, user experience, or verification. Each
    batch may contain one to three related questions with two to four choices,
    one recommendation, and concrete consequences. Maintain one compact
    repository investigation ledger for the run. Risk and verification stages
    must reuse it, inspect only newly identified gaps, and never repeat answered
    questions or broad discovery from an earlier stage.
planning:
  session_scope: run
  token_budget:
    metric: new_tokens
    limit: 1000000
    synthesis_reserve: 200000
    on_exhausted: force_synthesis
profile:
  source: .codex/koni/profile.yaml
intake:
  fields:
    goal:
      label: Goal
      description: Describe the outcome Koni should deliver.
      type: text
      required: true
  order: [goal]
pipeline:
  stages:
    intake:
      kind: action
      title: Validate intake
      config: {compiler_owned: true, action: planning.intake}
    architecture-plan:
      kind: planning
      title: Plan architecture
      config:
        persona: run-planner
        prompt: >-
          Establish the shared repository baseline and produce the architecture and decision plan:
          affected contracts, dependencies, boundaries, migrations, ticket seams, and unresolved
          approval choices. Do not expand into detailed risk or verification prose yet.
    risk-plan:
      kind: planning
      title: Plan risk controls
      config:
        persona: run-planner
        prompt: >-
          Using the architecture and repository ledger already in this thread, produce the risk plan:
          concrete failure modes, compatibility and rollout hazards, mitigations, rollback controls,
          and escalation boundaries. Inspect only specific evidence gaps.
    verification-plan:
      kind: planning
      title: Plan verification
      config:
        persona: run-planner
        prompt: >-
          Using the existing architecture, decisions, risks, and repository ledger, produce the
          verification plan: acceptance evidence, targeted checks, regression coverage,
          observability, and completion criteria. Do not repeat repository discovery.
    approval:
      kind: approval
      title: Approve the plans
    initialize:
      kind: initialize
      title: Initialize the run
    orchestrate:
      kind: orchestration
      title: Execute compiled work
    target-sync:
      kind: target_sync
      title: Synchronize the target branch
    independent-review:
      kind: agent_review
      title: Independently review the run
      config:
        persona: reviewer
        prompt: Independently review the completed run against its goal, evidence, checks, and unresolved risks.
    verification:
      kind: checkpoint
      title: Verify the completed run
      config: {checkpoint: verification}
    report:
      kind: action
      title: Compile final report
      config: {action: report, automatic: true}
    promotion:
      kind: promotion
      title: Merge the completed run
  order: [intake, architecture-plan, risk-plan, verification-plan, approval, initialize, orchestrate, target-sync, independent-review, verification, report, promotion]
questions:
  policy: interactive
  default_scope: run
git:
  branch_template: "koni/runs/{{ run.slug }}-{{ run.short_id }}"
  ticket_branch_template: "koni/runs/{{ run.id }}/tickets/{{ ticket.id }}"
promotion:
  conflict_operation: resolve-target-integration
run_card:
  sections: [goal, pipeline, graph, tickets, checks, report]
agents:
  roles:
    planner: {model: gpt-5.6-sol, reasoning_effort: ultra}
    lead: {model: gpt-5.6-sol, reasoning_effort: ultra}
    ticket_worker: {model: gpt-5.6-sol, reasoning_effort: xhigh}
    reviewer: {model: gpt-5.6-sol, reasoning_effort: ultra}
  personas: {}
orchestration:
  auto_start: true
  max_parallel: 5
  compile_action: compile
  lead_action: spawn-lead
  report_action: report
