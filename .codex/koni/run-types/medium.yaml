schema_version: "1.0"
id: medium
title: Medium
description: A standard feature with one combined plan, targeted questions, parallel execution, and a verification checkpoint.
instructions:
  planning: |
    Begin with a lightweight decision scan before broad repository inspection.
    Ask one focused batch of one to three questions early when the answers would
    materially change scope, architecture, safety, user experience, or
    verification. Give each question two to four choices, one recommendation,
    and the consequence of each choice. After those decisions are resolved,
    perform one consolidated investigation pass and produce the combined plan;
    do not repeatedly rediscover the same repository areas.
planning:
  session_scope: run
  token_budget:
    metric: new_tokens
    limit: 450000
    synthesis_reserve: 90000
    on_exhausted: force_synthesis
profile:
  source: .codex/koni/profile.yaml
intake:
  fields:
    goal:
      label: Goal
      description: Describe the outcome Koni should deliver.
      type: text
      required: true
  order: [goal]
pipeline:
  stages:
    intake:
      kind: action
      title: Validate intake
      config: {compiler_owned: true, action: planning.intake}
    combined-plan:
      kind: planning
      title: Plan implementation, architecture, and risk
      config:
        persona: run-planner
        prompt: Produce one concise, implementation-ready plan covering decisions, architecture, dependency-ordered vertical slices, exact red-to-green test argv and expected failures, risks, ticket boundaries, and completion evidence. Maintain one compact repository ledger and investigate only details that can change those decisions.
    approval:
      kind: approval
      title: Approve the plan
    initialize:
      kind: initialize
      title: Initialize the run
    orchestrate:
      kind: orchestration
      title: Execute compiled work
    target-sync:
      kind: target_sync
      title: Synchronize the target branch
    verification:
      kind: checkpoint
      title: Verify the completed run
      config: {checkpoint: verification}
    report:
      kind: action
      title: Compile final report
      config: {action: report, automatic: true}
    promotion:
      kind: promotion
      title: Merge the completed run
  order: [intake, combined-plan, approval, initialize, orchestrate, target-sync, verification, report, promotion]
questions:
  policy: high_impact_only
  default_scope: run
git:
  branch_template: "koni/runs/{{ run.slug }}-{{ run.short_id }}"
  ticket_branch_template: "koni/runs/{{ run.id }}/tickets/{{ ticket.id }}"
promotion:
  conflict_operation: resolve-target-integration
run_card:
  sections: [goal, pipeline, graph, tickets, checks, report]
agents:
  roles:
    planner: {model: gpt-5.6-sol, reasoning_effort: max}
    lead: {model: gpt-5.6-sol, reasoning_effort: xhigh}
    ticket_worker: {model: gpt-5.6-terra, reasoning_effort: high}
    reviewer: {model: gpt-5.6-sol, reasoning_effort: max}
  personas: {}
orchestration:
  auto_start: true
  max_parallel: 3
  compile_action: compile
  lead_action: spawn-lead
  report_action: report
