schema_version: "1.0"
module: {id: software.checks, version: 0.1.0}

checks:
  - id: ticket-worktree-setup
    kind: command
    argv: [pnpm, install, --frozen-lockfile, --prefer-offline]
    cwd: .
    timeout_seconds: 1200
    receipt_type: worktree_setup
    effect: workspace_write
    environment:
      inherit: [PATH, HOME, TMPDIR, CI, PNPM_HOME, COREPACK_HOME]
  - id: expected-red
    kind: command
    applies_to: [implement-change, implement-migration]
    command_source:
      kind: node
      selection: target
      node_types: [change, migration]
      role: implementation
      field: spec.test_command
    cwd: .
    timeout_seconds: 300
    expected_exit_codes: [1]
    receipt_type: expected_red
    receipt_freshness: historical
    effect: read_only
    environment:
      inherit: [PATH, HOME, TMPDIR, CI]
  - id: focused-test
    kind: command
    applies_to: [implement-change, implement-migration]
    command_source:
      kind: node
      selection: target
      node_types: [change, migration]
      role: implementation
      field: spec.test_command
    cwd: .
    timeout_seconds: 300
    receipt_type: test
    effect: read_only
    environment:
      inherit: [PATH, HOME, TMPDIR, CI]
  - id: proof-command
    kind: command
    applies_to: [establish-proof]
    command_source:
      kind: node
      selection: target
      node_types: [proof]
      role: proof
      field: spec.command
    cwd: .
    timeout_seconds: 900
    receipt_type: proof
    effect: read_only
    environment:
      inherit: [PATH, HOME, TMPDIR, CI]
  - id: package-typecheck
    kind: command
    applies_to: [implement-change, implement-migration]
    argv: [pnpm, typecheck]
    cwd: .
    timeout_seconds: 600
    receipt_type: typecheck
    effect: read_only
    environment:
      inherit: [PATH, HOME, TMPDIR, CI]
  - id: repo-lint
    kind: command
    applies_to: [prepare-delivery]
    argv: [pnpm, lint]
    cwd: .
    timeout_seconds: 900
    receipt_type: lint
    effect: read_only
    environment:
      inherit: [PATH, HOME, TMPDIR, CI]
  - id: browser-smoke
    kind: agent
    applies_to: [establish-proof]
    timeout_seconds: 900
    receipt_type: browser_smoke
    effect: external
