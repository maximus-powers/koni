state_machines:
- id: ticket
  initial: queued
  states:
  - proposed
  - queued
  - in_progress
  - integrating
  - closed
  - blocked
  terminal_states:
  - closed
  transitions:
  - id: propose-change-request
    from:
    - queued
    to: proposed
    actors:
    - compiler
  - id: approve-change-request
    from:
    - proposed
    to: queued
    actors:
    - compiler
  - id: reject-change-request
    from:
    - proposed
    to: closed
    actors:
    - compiler
  - id: make-actionable
    from:
    - proposed
    to: queued
    actors:
    - compiler
  - id: start
    from:
    - queued
    to: in_progress
    actors:
    - compiler
  - id: request-review
    from:
    - in_progress
    to: integrating
    actors:
    - compiler
  - id: review-failed
    from:
    - integrating
    to: in_progress
    actors:
    - compiler
  - id: finish-reviewed
    from:
    - integrating
    to: closed
    actors:
    - compiler
  - id: block-active
    from:
    - in_progress
    - integrating
    to: blocked
    actors:
    - compiler
  - id: release-blocker
    from:
    - blocked
    to: queued
    actors:
    - compiler
  - id: reopen-stale-obligation
    from:
    - closed
    to: queued
    actors:
    - compiler
  - id: interrupt-active
    from:
    - in_progress
    to: queued
    actors:
    - compiler
  - id: retire-queued
    from:
    - queued
    to: closed
    actors:
    - compiler
  - id: retire-active
    from:
    - in_progress
    - integrating
    - blocked
    to: closed
    actors:
    - compiler
- id: run
  initial: active
  states:
  - active
  - paused
  - concluded
  - stopped
  - failed
  terminal_states:
  - concluded
  - stopped
  - failed
  transitions:
  - id: pause
    from:
    - active
    to: paused
    actors:
    - human
    - lead
  - id: resume
    from:
    - paused
    to: active
    actors:
    - human
    - lead
  - id: conclude
    from:
    - active
    - paused
    to: concluded
    actors:
    - compiler
    - lead
  - id: stop
    from:
    - active
    - paused
    to: stopped
    actors:
    - human
  - id: fail
    from:
    - active
    - paused
    to: failed
    actors:
    - compiler
  - id: cleanup-concluded
    from:
    - concluded
    to: stopped
    actors:
    - human
  - id: cleanup-failed
    from:
    - failed
    to: stopped
    actors:
    - human
