schema_version: '3.0'
id: small
title: Small
description: A focused task with direct approval, one worker at a time, and no agent planning pass.
instructions:
  planning: |
    Ask no planning questions for this run type. Proceed conservatively, make
    reversible assumptions where necessary, and list those assumptions clearly
    for the user's approval before research work begins.
    Keep evidence receipt-backed and explicitly bounded with
    `evidence_basis: empirical_runtime` and
    `inference_scope: bounded_empirical`; route proof or source review to
    methods, gates, prerequisites, or review controls.
profile:
  source: .koni/profile.yaml
intake:
  objective_field: goal
  fields:
    goal:
      label: Goal
      description: Describe the research outcome Koni should deliver.
      type: text
      required: true
    hypothesis:
      label: Hypothesis
      description: >-
        State the concise, declarative, falsifiable scientific proposition this run
        tests, derived from the goal above. It must name the specific mechanism or
        quantity under study and assert something that a bounded experiment could
        contradict - for example "matched fixed-probe activation signatures encode
        instance-specific behavioral information that enables controlled weight-space
        interpretation and decoding". A restatement of the goal, a statement about
        tooling or readiness rather than the subject of study, or a proposition no
        observation could falsify is not a hypothesis and will produce a meaningless
        evidence graph. This run type has no agent planning pass, so nothing refines
        this text: use the medium run type to have the hypothesis derived for you.
      type: text
      required: true
  order:
  - goal
  - hypothesis
pipeline:
  stages:
    intake:
      kind: action
      title: Validate intake
      config:
        compiler_owned: true
        action: planning.intake
    approval:
      kind: approval
      title: Approve the run
    initialize:
      kind: initialize
      title: Initialize the run
    orchestrate:
      kind: orchestration
      title: Execute compiled work
    target-sync:
      kind: target_sync
      title: Synchronize the target branch
    verification:
      kind: checkpoint
      title: Verify the completed research
      config:
        checkpoint: verification
    report:
      kind: action
      title: Compile final report
      config:
        action: report
        automatic: true
    promotion:
      kind: promotion
      title: Promote the completed research to the target branch
  order:
  - intake
  - approval
  - initialize
  - orchestrate
  - target-sync
  - verification
  - report
  - promotion
questions:
  policy: autonomous
  default_scope: run
git:
  branch_template: koni/runs/{{ run.id }}/integration
  ticket_branch_template: koni/runs/{{ run.id }}/tickets/{{ ticket.id }}/cycles/{{ cycle.id }}
promotion:
  conflict_operation: resolve-target-integration
run_card:
  sections:
  - goal
  - pipeline
  - graph
  - tickets
  - checks
  - report
agents:
  roles:
    planner:
      model: gpt-5.6-terra
      thinking_level: high
    lead:
      model: gpt-5.6-sol
      thinking_level: xhigh
    ticket_worker:
      model: gpt-5.6-terra
      thinking_level: high
    reviewer:
      model: gpt-5.6-terra
      thinking_level: high
  overrides: {}
orchestration:
  auto_start: true
  max_parallel: 1
  compile_action: compile
  lead_action: spawn-lead
  report_action: report
