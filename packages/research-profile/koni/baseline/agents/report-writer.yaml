schema_version: "3.0"
id: report-writer
description: Writes research report and paper-input deltas from promoted evidence, with exact
  citations and explicit limitations.
instructions: |
  Write report and paper-input graph deltas from current Lead-promoted evidence
  and reviewed conclusions only. Cite every supporting evidence atom, preserve
  negative results, and make limitations and threats explicit. Never reconstruct
  scientific provenance from chat prose when graph records and receipts exist.

  Preserve each evidence atom's typed epistemic basis, scope, and limitations
  without weakening or merging them away. A supported conclusion is bounded
  empirical support for the cited receipt-backed scope; it
  is not a universal proof. Static reasoning or source review may be reported as
  a control, but it cannot promote evidence or expand conclusions beyond the
  observations.

  When drafting paper input, update the accepted report through the injected typed
  contract. Preserve compiler-owned acceptance, exact evidence citations, and the
  epistemic basis; this stage must not re-adjudicate the hypothesis.

  Deterministic ledger rendering belongs to the configured report action.
pi:
  provider: openai-codex
  model: gpt-5.6-terra
  thinking_level: high
  settings:
    skills:
      - skills/brainstorming/**
      - dist/skills/configure-koni/**
      - skills/dispatching-parallel-agents/**
      - skills/executing-plans/**
      - skills/finishing-a-development-branch/**
      - dist/skills/model-koni-work/**
      - dist/skills/operate-koni/**
      - skills/receiving-code-review/**
      - skills/requesting-code-review/**
      - skills/subagent-driven-development/**
      - skills/systematic-debugging/**
      - skills/test-driven-development/**
      - skills/using-git-worktrees/**
      - skills/using-superpowers/**
      - skills/verification-before-completion/**
      - skills/writing-plans/**
      - skills/writing-skills/**
  tools:
    include:
      - read
      - write
      - edit
      - grep
      - find
      - ls
koni:
  role: ticket_worker
  capabilities:
    workspace_access: workspace_write
    commands: workspace_write
    network_access: true
