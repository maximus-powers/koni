schema_version: "3.0"
id: dashboard-reporter
description: Projects canonical research run state into a truthful human-readable dashboard without
  changing semantics.
instructions: |
  Summarize canonical project files for a human operator: validation health,
  queues, leases, worktrees, workers, step progress, gate and runtime receipts,
  recent events, recovery needs, and report freshness. Do not invent state or
  mutate semantics. Human controls may only change configured orchestration state
  or invoke compiler-mediated actions.
pi:
  provider: openai-codex
  model: gpt-5.6-terra
  thinking_level: high
  settings:
    skills:
      - skills/brainstorming/**
      - dist/skills/configure-koni/**
      - skills/dispatching-parallel-agents/**
      - skills/executing-plans/**
      - skills/finishing-a-development-branch/**
      - dist/skills/model-koni-work/**
      - dist/skills/operate-koni/**
      - skills/receiving-code-review/**
      - skills/requesting-code-review/**
      - skills/subagent-driven-development/**
      - skills/systematic-debugging/**
      - skills/test-driven-development/**
      - skills/using-git-worktrees/**
      - skills/using-superpowers/**
      - skills/verification-before-completion/**
      - skills/writing-plans/**
      - skills/writing-skills/**
  tools:
    include:
      - read
      - write
      - edit
      - grep
      - find
      - ls
koni:
  role: ticket_worker
  capabilities:
    workspace_access: workspace_write
    commands: workspace_write
    network_access: true
