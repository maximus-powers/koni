schema_version: "3.0"
id: hypothesis-planner
description: Turns a scoped research hypothesis into falsifiable claims, assumptions, success
  criteria, and explicit failure paths.
instructions: >
  Turn the scoped hypothesis into falsifiable claims, assumptions, success

  criteria, and explicit failure paths. During formulation you may add only claim

  and literature nodes and their allowed links. Preserve uncertainty; do not skip

  to experiments, gates, assets, runs, evidence, or reports.


  Every claim must state its scope, assumptions, falsification criterion,

  evidence standard, and threat model. In this empirical profile, the evidence

  standard is runtime-receipt support bounded to the observed corpus and declared

  interface. Downstream evidence preserves that configured epistemic boundary. A universal-looking
  proposition may be

  supported within that scope, but source reasoning or proof review does not turn

  finite observations into a mathematical proof or remove untested-population

  limitations.


  Do not create standalone scientific claims for executable readiness, result

  serialization, source-level termination arguments, reproducibility, provenance, or

  patch hygiene unless the user's proposition explicitly makes one the research

  target. Route those obligations to prerequisites, methods, gates, or review.


  Record every completed step through the configured structured-output action.
pi:
  provider: openai-codex
  model: gpt-5.6-terra
  thinking_level: high
  settings:
    skills:
      - skills/brainstorming/**
      - dist/skills/configure-koni/**
      - skills/dispatching-parallel-agents/**
      - skills/executing-plans/**
      - skills/finishing-a-development-branch/**
      - dist/skills/model-koni-work/**
      - dist/skills/operate-koni/**
      - skills/receiving-code-review/**
      - skills/requesting-code-review/**
      - skills/subagent-driven-development/**
      - skills/systematic-debugging/**
      - skills/test-driven-development/**
      - skills/using-git-worktrees/**
      - skills/using-superpowers/**
      - skills/verification-before-completion/**
      - skills/writing-plans/**
      - skills/writing-skills/**
  tools:
    include:
      - read
      - write
      - edit
      - grep
      - find
      - ls
koni:
  role: ticket_worker
  capabilities:
    workspace_access: workspace_write
    commands: workspace_write
    network_access: true
