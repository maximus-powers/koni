protocol: koni.pi-resource-bindings.v1
bindings:
  - id: context-mode
    package: context-mode
    description: Optional interactive Pi context tools outside contained research attempts.
    enabled: false
    integration: interactive_only
    resources: [extension, skill]
    select: {skills: [], prompts: [], tools: []}
    stages: []
    personas: []
    requires_network: false
    rationale: It may help an operator explore large corpora, but it must not rewrite compiler-bound graph context or Koni compaction state.
  - id: feynman-research
    package: '@companion-ai/feynman'
    description: Optional literature, critique, and research-writing skills for selected research tickets.
    enabled: false
    integration: skills_only
    resources: [skill, prompt]
    select: {skills: [], prompts: [], tools: []}
    stages: [evidence, graph-compilation, reporting]
    personas: [evidence-analyst, report-writer, research-scout, reviewer]
    requires_network: true
    rationale: Source-grounded research skills can complement typed Koni tickets, while Feynman's own agents, execution loops, credentials, and output store remain outside autonomous Koni authority.
  - id: pi-subagents
    package: pi-subagents
    description: Community child-agent orchestration for ordinary interactive Pi research.
    enabled: false
    integration: not_recommended
    resources: [extension, skill, prompt]
    select: {skills: [], prompts: [], tools: []}
    stages: []
    personas: []
    requires_network: false
    rationale: Koni already schedules research attempts from compiler-ready tickets; nested ambient delegation would bypass grants, graph deltas, and evidence receipts.
  - id: web-access
    package: pi-web-access
    description: Optional web, paper, PDF, and repository retrieval for explicit research discovery.
    enabled: false
    integration: explicit_tools
    resources: [extension, skill]
    select: {skills: [], prompts: [], tools: []}
    stages: [evidence, graph-compilation]
    personas: [evidence-analyst, research-scout]
    requires_network: true
    rationale: External source retrieval is useful for literature work, but every contained use must be explicitly selected, network-enabled, bounded, and recorded as provenance.
