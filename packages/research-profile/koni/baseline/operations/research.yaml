- id: graph-compilation.node.define-gates
  operation: define-gates
  stage: graph_compilation
  target_types:
  - experiment
  # Generic gate synthesis is safe only at the experiment boundary.  Methods,
  # claims, metrics, and prerequisites inherit that experiment's explicitly
  # planned verifier gates; giving each a new capability-backed gate can create
  # an unowned verifier contract with no authorized asset ticket.
  workflow: define-gates
  allowed_new_node_types:
  - gate
  # The write-gate-contracts workflow must create exactly one typed gate and
  # its canonical gate.applies_to edge for the selected target node.
  max_new_nodes: 1
  allowed_existing_node_types: []
  allow_node_deletion: false
  allow_gate_contract_edits: false
  gate_blocking_exempt: true
  change_control_barrier: false
  change_control:
    role: ordinary
    allow_upstream_requests: true
    proposal_operation: change-request
  review_contract: independent expected-red gate semantics review; require the configured typed command/result, capability, oracle, applicability, failure, and canonical gate.applies_to contract, but because this operation is gate-blocking-exempt and asset creation is a stop condition, do not require a downstream executable asset, runtime execution, or passing gate receipt at this boundary
  output_contract: expected-red gate contract graph delta that reuses a visible compatible verifier capability whenever one exists, with one canonical gate.applies_to fact whose inverse gates view is compiler-derived, plus structured step outputs; a new capability requires an explicit incompatibility with every visible verifier interface
  dispatch_priority: 530
  ranking_hints:
  - stage
  - node-type-priority
  - node-id
