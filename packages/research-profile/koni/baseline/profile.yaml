schema_version: '3.0'
engine: '>=0.1.0,<0.2.0'
profile:
  id: research
  version: 1.1.36
  description: Graph-first academic research workflow with gate-first validation, scientific receipt provenance, and reviewed evidence promotion.
initialization:
  root_node_type: hypothesis
  goal_field: objective
  planning_context_field: planning_context
  planning_seed_operation: initialization.hypothesis.seed-approved-plan
  root_status: active
git:
  enabled: true
  backend: git_cli
  integration_branch: main
  ticket_branch_template: koni/runs/{{ run.id }}/tickets/{{ ticket.id }}/cycles/{{ cycle.id }}
  worktree_root: .koni-worktrees
  integration_strategy: squash
  commit_template: '{{ ticket.operation }}: {{ ticket.title }}'
  commit_trailers:
    Koni-Profile: '{{ profile.hash }}'
    Koni-Review: '{{ review.id }}'
orchestration:
  max_parallel: 64
  max_boundaries_per_lead: 1
  disjoint_scope_parallelism: true
reporting:
  bundle_kind: research-ledger-bundle
imports:
  graph:
  - graph/nodes.yaml
  - graph/edges.yaml
  rules:
  - rules/research.yaml
  - rules/lifecycle.yaml
  operations:
  - operations/research.yaml
  workflows:
  - workflows/research.yaml
  actions:
  - actions/research.yaml
  checks:
  - checks/research.yaml
  reports:
  - reports/research.yaml
  cockpit:
  - cockpit/research.yaml
