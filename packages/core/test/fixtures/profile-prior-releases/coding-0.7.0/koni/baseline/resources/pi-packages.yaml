protocol: koni.pi-resource-bindings.v1
bindings:
  - id: browser-verification
    package: pi-agent-browser-native
    description: Native browser automation for explicitly approved UI verification.
    enabled: false
    integration: explicit_tools
    resources: [extension]
    select: {skills: [], prompts: [], tools: []}
    stages: [verification]
    personas: [verifier]
    requires_network: true
    rationale: Browser control is useful for UI evidence, but it has external effects and must be compiler-selected with an explicit network/browser grant.
  - id: coding-methods
    package: bigpowers
    description: Optional software-engineering skills and prompts for planning and review.
    enabled: false
    integration: skills_only
    resources: [skill, prompt]
    select: {skills: [], prompts: [], tools: []}
    stages: [combined-plan, focused-plan, independent-review, orchestrate]
    personas: [implementer, reviewer, run-planner]
    requires_network: false
    rationale: Individual skills may complement Koni tickets, but the package's separate lifecycle must not replace Koni graph, workflow, or receipt authority.
  - id: context-mode
    package: context-mode
    description: Optional interactive Pi context tools outside contained Koni attempts.
    enabled: false
    integration: interactive_only
    resources: [extension, skill]
    select: {skills: [], prompts: [], tools: []}
    stages: []
    personas: []
    requires_network: false
    rationale: Its context lifecycle is valuable interactively but must not rewrite compiler-bound autonomous context or Koni compaction state.
  - id: fuzzy-search
    package: '@ff-labs/pi-fff'
    description: Optional interactive fuzzy file and content search.
    enabled: false
    integration: interactive_only
    resources: [extension]
    select: {skills: [], prompts: [], tools: []}
    stages: []
    personas: []
    requires_network: false
    rationale: It replaces ambient Pi search tools, while contained Koni attempts must use exact Koni-authorized tool definitions and path grants.
  - id: pi-subagents
    package: pi-subagents
    description: Community child-agent orchestration for ordinary interactive Pi sessions.
    enabled: false
    integration: not_recommended
    resources: [extension, skill, prompt]
    select: {skills: [], prompts: [], tools: []}
    stages: []
    personas: []
    requires_network: false
    rationale: Koni deterministically schedules immutable attempt sessions; a second autonomous scheduler would bypass max-parallel, grants, tickets, and receipts.
  - id: web-access
    package: pi-web-access
    description: Optional web and source retrieval for explicitly network-enabled planning.
    enabled: false
    integration: explicit_tools
    resources: [extension, skill]
    select: {skills: [], prompts: [], tools: []}
    stages: [architecture-plan, combined-plan, focused-plan]
    personas: [architecture-mapper, run-planner]
    requires_network: true
    rationale: Web evidence can improve dependency research, but URL fetching, repository cloning, and credential fallbacks require explicit grants and bounded outputs.
