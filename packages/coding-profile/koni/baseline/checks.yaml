schema_version: '2.0'
module:
  id: software.checks
  version: 0.4.0
checks:
- id: proof-expected-red
  kind: command
  applies_to:
  - implement-change
  - implement-migration
  - prepare-proof
  command_source:
    kind: node
    selection: target
    node_types:
    - proof
    role: proof
    field: spec.command
  cwd: .
  timeout_seconds: 900
  expected_exit_codes:
  - 1
  - 101
  receipt_type: proof_expected_red
  receipt_freshness: historical
  composed_replay: never
  effect: read_only
  environment:
    inherit:
    - PATH
    - HOME
    - TMPDIR
    - CI
- id: proof-current-baseline
  kind: command
  applies_to:
  - implement-change
  - implement-migration
  - prepare-proof
  command_source:
    kind: node
    selection: target
    node_types:
    - proof
    role: proof
    field: spec.command
  cwd: .
  timeout_seconds: 900
  receipt_type: proof_current_baseline
  receipt_freshness: historical
  composed_replay: never
  effect: read_only
  environment:
    inherit:
    - PATH
    - HOME
    - TMPDIR
    - CI
- id: proof-command
  kind: command
  applies_to:
  - implement-change
  - implement-migration
  - establish-proof
  command_source:
    kind: node
    selection: target
    node_types:
    - proof
    role: proof
    field: spec.command
  cwd: .
  timeout_seconds: 900
  receipt_type: proof
  effect: read_only
  environment:
    inherit:
    - PATH
    - HOME
    - TMPDIR
    - CI
- id: baseline-proof-set
  kind: composite
  applies_to:
  - implement-change
  - implement-migration
  - prepare-proof
  receipt_type: proof_baseline_set
  graph_set:
    members: $target
    member_node_types:
    - proof
    member_check_field: spec.baseline_check_id
    source_paths_field: spec.source_paths
    covered_paths_field: spec.covered_paths
    working_directory_field: spec.working_directory
    status_excluding:
    - superseded
    min_members: 1
- id: promotion-proof-set
  kind: composite
  applies_to:
  - implement-change
  - implement-migration
  - establish-proof
  receipt_type: proof_set
  graph_set:
    members: $target
    member_node_types:
    - proof
    member_check: proof-command
    source_paths_field: spec.source_paths
    covered_paths_field: spec.covered_paths
    working_directory_field: spec.working_directory
    status_excluding:
    - superseded
    min_members: 1
