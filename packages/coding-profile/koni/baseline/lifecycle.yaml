schema_version: '2.0'
module:
  id: software.lifecycle
  version: 0.3.0
state_machines:
- id: ticket
  initial: todo
  states:
  - proposed
  - todo
  - in_progress
  - integrating
  - blocked
  - closed
  - retired
  terminal_states:
  - closed
  - retired
  transitions:
  - id: propose-change
    from:
    - todo
    to: proposed
    actors:
    - lead
    - compiler
  - id: approve
    from:
    - proposed
    to: todo
    actors:
    - lead
  - id: reject-proposal
    from:
    - proposed
    to: closed
    actors:
    - lead
    - compiler
  - id: start
    from:
    - todo
    to: in_progress
    actors:
    - lead
    - compiler
  - id: request-review
    from:
    - in_progress
    to: integrating
    actors:
    - lead
    - compiler
  - id: rework
    from:
    - integrating
    to: in_progress
    actors:
    - reviewer
    - compiler
  - id: block-todo
    from:
    - todo
    to: blocked
    actors:
    - compiler
  - id: block-active
    from:
    - in_progress
    - integrating
    to: blocked
    actors:
    - compiler
  - id: release
    from:
    - blocked
    to: todo
    actors:
    - compiler
    - lead
  - id: interrupt-active
    from:
    - in_progress
    to: todo
    actors:
    - compiler
  - id: finish
    from:
    - integrating
    - in_progress
    to: closed
    actors:
    - compiler
  - id: resolve-blocked
    from:
    - blocked
    to: closed
    actors:
    - compiler
  - id: reopen-stale-obligation
    from:
    - closed
    to: todo
    actors:
    - compiler
  - id: retire
    from:
    - proposed
    - todo
    - blocked
    to: retired
    actors:
    - compiler
- id: run
  initial: active
  states:
  - active
  - paused
  - concluded
  - stopped
  - failed
  terminal_states:
  - concluded
  - stopped
  - failed
  transitions:
  - id: pause
    from:
    - active
    to: paused
    actors:
    - human
    - lead
  - id: resume
    from:
    - paused
    to: active
    actors:
    - human
    - lead
  - id: conclude
    from:
    - active
    - paused
    to: concluded
    actors:
    - compiler
    - lead
  - id: stop
    from:
    - active
    - paused
    to: stopped
    actors:
    - human
  - id: fail
    from:
    - active
    - paused
    to: failed
    actors:
    - compiler
  - id: cleanup-concluded
    from:
    - concluded
    to: stopped
    actors:
    - human
  - id: cleanup-failed
    from:
    - failed
    to: stopped
    actors:
    - human
