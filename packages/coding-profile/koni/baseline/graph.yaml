      denominator:
        intersection:
        - traverse:
            from: $node
            relation: introduces
            max_depth: 1
            node_types:
            - risk
        - active_risks
    - for_all:
        select:
          traverse:
            from: $node
            relation: realizes
            max_depth: 1
            node_types:
            - objective
        bind: implementation_objective
        satisfies:
          all:
          - any:
            - not:
                op: field_equals
                subject: $implementation_objective
                field: spec.work_kind
                value: bug_fix
            - exists:
                intersection:
                - traverse:
                    from: $implementation_objective
                    relation: defects
                    max_depth: 1
                    node_types:
                    - defect
                - active_defects
          - op: coverage
            numerator: diagnosed_defects
            denominator:
              intersection:
              - traverse:
                  from: $implementation_objective
                  relation: defects
                  max_depth: 1
                  node_types:
                  - defect
              - active_defects
          - any:
            - not:
                exists:
                  intersection:
                  - traverse:
                      from: $implementation_objective
                      relation: defects
                      max_depth: 1
                      node_types:
                      - defect
                  - active_defects
            - exists:
                intersection:
                - traverse:
                    from: $node
                    relation: addresses
                    max_depth: 1
                    node_types:
                    - defect
                - diagnosed_defects
- id: design_ready_migrations
  select: active_migrations
  where:
    all:
    - exists:
        intersection:
        - traverse:
            from: $node
            relation: verified_by
            max_depth: 1
            node_types:
            - proof
        - well_scoped_implementation_proofs
    - for_all:
        select:
          intersection:
          - traverse:
              from: $node
              relation: verified_by
              max_depth: 1
              node_types:
              - proof
          - active_proofs
        bind: direct_migration_proof
        satisfies:
          exists:
            intersection:
            - $direct_migration_proof
            - well_scoped_implementation_proofs
    - any:
      - not:
          op: field_equals
          subject: $node
          field: spec.proof_strategy
          value: red_green
      - exists:
          intersection:
          - traverse:
              from: $node
              relation: verified_by
              max_depth: 1
              node_types:
              - proof
          - expected_red_implementation_proofs
- id: implementation_ready_migrations
  select: design_ready_migrations
  where:
    for_all:
      select:
        intersection:
        - traverse:
            from: $node
            relation: verified_by
            max_depth: 1
            node_types:
            - proof
        - preparation_eligible_implementation_proofs
      bind: prepared_migration_proof
      satisfies:
        exists:
          intersection:
          - $prepared_migration_proof
          - prepared_implementation_proofs
- id: executable_proofs
  select: active_proofs
  where:
    all:
    - for_all:
        select:
          traverse:
            from: $node
            relation: verifies
            max_depth: 1
            node_types:
            - contract
            - flow
            - defect
            - change
            - migration
            - risk
        bind: proof_subject
        satisfies:
          any:
          - all:
            - op: node_type_is
              subject: $proof_subject
              value: change
            - op: field_equals
              subject: $proof_subject
              field: status
              value: implemented
          - all:
            - op: node_type_is
              subject: $proof_subject
              value: migration
            - op: field_equals
              subject: $proof_subject
              field: status
              value: complete
          - all:
            - op: node_type_is
              subject: $proof_subject
              value: risk
            - exists:
                intersection:
                - $proof_subject
                - proof_ready_risks
          - all:
            - op: node_type_is
              subject: $proof_subject
              value: defect
            - exists:
                intersection:
                - $proof_subject
                - diagnosed_defects
            - exists:
                intersection:
                - traverse:
                    from: $proof_subject
                    relation: addressed_by
                    max_depth: 1
                    node_types:
                    - change
                - implemented_changes
          - all:
            - op: node_type_is
              subject: $proof_subject
              value: contract
            - op: field_in
              subject: $proof_subject
              field: status
              values:
              - active
              - satisfied
          - all:
            - op: node_type_is
              subject: $proof_subject
              value: flow
            - op: field_in
              subject: $proof_subject
              field: status
              values:
              - active
              - changed
    - any:
      - not:
          exists:
            intersection:
            - $node
            - union:
              - grounded_diagnostic_proofs
              - risk_boundary_proofs
      - op: proof_preparation_current
        subject: $node
        check: baseline-proof-set
        preparation_operation: assurance.proof.prepare
        preparation_targets:
          union:
          - $node
          - traverse:
              from: $node
              relation: verifies
              max_depth: 1
              node_types:
              - risk
- id: delivery_ready_objectives
  select: objectives
  where:
    all:
    - op: field_present
      subject: $node
      field: spec.work_kind
    - exists:
        intersection:
        - traverse:
            from: $node
            relation: realized_by
            max_depth: 1
            node_types:
            - change
        - active_changes
    - op: coverage
      numerator: implemented_changes
      denominator:
        intersection:
        - traverse:
            from: $node
            relation: realized_by
            max_depth: 1
            node_types:
            - change
        - active_changes
    - op: coverage
      numerator: design_ready_changes
      denominator:
        intersection:
        - traverse:
            from: $node
            relation: realized_by
            max_depth: 1
            node_types:
            - change
        - active_changes
    - for_all:
        select:
          intersection:
          - traverse:
              from: $node
              relation: realized_by
              max_depth: 1
              node_types:
              - change
          - active_changes
        bind: delivery_change
        satisfies:
          all:
          - exists:
              intersection:
              - traverse:
                  from: $delivery_change
                  relation: verified_by
                  max_depth: 1
                  node_types:
                  - proof
              - active_focused_proofs
          - for_all:
              select:
                intersection:
                - traverse:
                    from: $delivery_change
                    relation: verified_by
                    max_depth: 1
                    node_types:
                    - proof
                - active_proofs
              bind: delivery_change_proof
              satisfies:
                all:
                - op: field_equals
                  subject: $delivery_change_proof
                  field: status
                  value: passing
                - op: check_passed
                  subject: $delivery_change_proof
                  check: promotion-proof-set
          - for_all:
              select:
                traverse:
                  from: $delivery_change
                  relation: requires
                  max_depth: 1
                  node_types:
                  - decision
                  - migration
              bind: delivery_prerequisite
              satisfies:
                any:
                - all:
                  - op: node_type_is
                    subject: $delivery_prerequisite
                    value: decision
                  - op: field_equals
                    subject: $delivery_prerequisite
                    field: status
                    value: accepted
                - all:
                  - op: node_type_is
                    subject: $delivery_prerequisite
                    value: migration
                  - op: field_equals
                    subject: $delivery_prerequisite
                    field: status
                    value: complete
                  - exists:
                      intersection:
                      - traverse:
                          from: $delivery_prerequisite
                          relation: verified_by
                          max_depth: 1
                          node_types:
                          - proof
                      - active_proofs
                  - for_all:
                      select:
                        intersection:
                        - traverse:
                            from: $delivery_prerequisite
                            relation: verified_by
                            max_depth: 1
                            node_types:
                            - proof
                        - active_proofs
                      bind: delivery_migration_proof
                      satisfies:
                        all:
                        - op: field_equals
                          subject: $delivery_migration_proof
                          field: status
                          value: passing
                        - op: check_passed
                          subject: $delivery_migration_proof
                          check: promotion-proof-set
    - op: coverage
      numerator: delivery_ready_risks
      denominator:
        intersection:
        - active_risks
        - traverse:
            from:
              intersection:
              - traverse:
                  from: $node
                  relation: realized_by
                  max_depth: 1
                  node_types:
                  - change
              - active_changes
            relation: introduces
            max_depth: 1
            node_types:
            - risk
    - any:
      - not:
          op: field_equals
          subject: $node
          field: spec.work_kind
          value: bug_fix
      - exists:
          intersection:
          - traverse:
              from: $node
              relation: defects
              max_depth: 1
              node_types:
              - defect
          - active_defects
    - op: coverage
      numerator: diagnosed_defects
      denominator:
        intersection:
        - traverse:
            from: $node
            relation: defects
            max_depth: 1
            node_types:
            - defect
        - active_defects
    - for_all:
        select:
          intersection:
          - traverse:
              from: $node
              relation: defects
              max_depth: 1
              node_types:
              - defect
          - active_defects
        bind: delivery_defect
        satisfies:
          all:
          - exists:
              intersection:
              - traverse:
                  from: $delivery_defect
                  relation: addressed_by
                  max_depth: 1
                  node_types:
                  - change
              - implemented_changes
              - traverse:
                  from: $node
                  relation: realized_by
                  max_depth: 1
                  node_types:
                  - change
          - exists:
              intersection:
              - traverse:
                  from: $delivery_defect
                  relation: verified_by
                  max_depth: 1
                  node_types:
                  - proof
              - active_proofs
          - for_all:
              select:
                intersection:
                - traverse:
                    from: $delivery_defect
                    relation: verified_by
                    max_depth: 1
                    node_types:
                    - proof
                - active_proofs
              bind: delivery_defect_proof
              satisfies:
                all:
                - op: field_equals
                  subject: $delivery_defect_proof
                  field: status
                  value: passing
                - op: check_passed
                  subject: $delivery_defect_proof
                  check: promotion-proof-set
    - any:
      - not:
          op: field_equals
          subject: $node
          field: spec.work_kind
          value: continuous_improvement
      - all:
        - exists:
            traverse:
              from: $node
              relation: decomposes
              max_depth: 1
              node_types:
              - improvement_target
        - op: coverage
          numerator: resolved_improvement_targets
          denominator:
            intersection:
            - traverse:
                from: $node
                relation: decomposes
                max_depth: 1
                node_types:
                - improvement_target
            - improvement_targets
- id: deliveries
  node_types:
  - delivery
  status_excluding:
  - candidate_ready
  - superseded
- id: continuous_improvement_objectives
  select: objectives
  where:
    op: field_equals
    subject: $node
    field: spec.work_kind
    value: continuous_improvement
- id: improvement_targets
  node_types:
  - improvement_target
  status_excluding:
  - superseded
- id: active_improvement_targets
  node_types:
  - improvement_target
  status_excluding:
  - resolved
  - superseded
- id: active_candidate_approaches
  node_types:
  - candidate_approach
  status_excluding:
  - rejected
  - superseded
- id: accepted_selections
  node_types:
  - selection
  statuses:
  - accepted
- id: well_framed_targets
  select: active_improvement_targets
  where:
    all:
    - op: edge_count
      subject: $node
      relation: judged_by
      exact: 1
    - op: edge_count
      subject: $node
      relation: explores
      min: 2
- id: proven_candidate_approaches
  select: active_candidate_approaches
  where:
    all:
    - exists:
        intersection:
        - traverse:
            from: $node
            relation: verified_by
            max_depth: 1
            node_types:
            - proof
        - passing_proofs
    - exists:
        traverse:
          from: $node
          relation: evaluated_by
          max_depth: 1
          node_types:
          - evaluation
- id: fully_explored_targets
  select: well_framed_targets
  where:
    op: coverage
    numerator: proven_candidate_approaches
    denominator:
      intersection:
      - traverse:
          from: $node
          relation: explores
          max_depth: 1
          node_types:
          - candidate_approach
      - active_candidate_approaches
- id: resolved_improvement_targets
  select: improvement_targets
  where:
    exists:
      intersection:
      - traverse:
          from: $node
          relation: resolved_by
          max_depth: 1
          node_types:
          - selection
      - accepted_selections
graph_constraints:
- id: preparation-proof-source-paths-pairwise-disjoint
  kind: path_sets_disjoint
  left:
    select:
      union:
      - diagnostic_proofs
      - risk_boundary_proofs
      - preparation_eligible_implementation_proofs
    node_types:
    - proof
    field: spec.source_paths
  right:
    select:
      union:
      - diagnostic_proofs
      - risk_boundary_proofs
      - preparation_eligible_implementation_proofs
    node_types:
    - proof
    field: spec.source_paths
  distinct_nodes: true
- id: preparation-and-implementation-proof-source-paths-disjoint
  kind: path_sets_disjoint
  left:
    select:
      union:
      - diagnostic_proofs
      - risk_boundary_proofs
      - preparation_eligible_implementation_proofs
    node_types:
    - proof
    field: spec.source_paths
  right:
    select: well_scoped_implementation_proofs
    node_types:
    - proof
    field: spec.source_paths
  distinct_nodes: true
