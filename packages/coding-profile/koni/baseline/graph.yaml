schema_version: '3.0'
module:
  id: software.graph
  version: 0.6.0
node_types:
- id: objective
  description: A desired user, product, or operational outcome that gives the run its scope, intent, non-goals, and observable success criteria.
  stage: framing
  required_any:
  - - outcome
  statuses:
  - draft
  - active
  - satisfied
  - superseded
  initial_status: active
  compiler_owned_fields:
  - spec.planning_context
  agent_visible_compiler_owned_fields:
  - spec.planning_context
  fields:
    outcome:
      type: string
      required: true
    work_kind:
      type: string
      enum:
      - general
      - new_feature
      - bug_fix
      - refactor
      - maintenance
      - migration
      - continuous_improvement
      description: Optional at legacy initialization, but mechanically required before implementation begins.
    motivation:
      type: string
    scope_boundaries:
      type: list
    success_signals:
      type: list
    external_refs:
      type: list
    planning_context:
      type: object
      required: false
      description: A bounded, compiler-owned record of the approved plan and resolved decisions that authoritatively guide this run.
- id: system
  description: The smallest repository-native ownership boundary materially affected by the objective.
  stage: architecture
  required_any:
  - - responsibility
  statuses:
  - draft
  - active
  - changed
  - superseded
  initial_status: active
  fields:
    kind:
      type: string
      required: true
      enum:
      - package
      - service
      - app
      - domain
      - integration
      - infrastructure
    responsibility:
      type: string
      required: true
    contract_required:
      type: boolean
      required: true
      description: True only when an acceptance, compatibility, safety, or behavioral contract materially constrains this boundary.
    contract_reason:
      type: string
      required: true
      description: Why a contract is material or why ordinary repository behavior is sufficient.
    owned_paths:
      type: list
      required: true
      items:
        type: path
        required: true
      description: Exact project-root-relative files or directories owned by this boundary.
    owned_packages:
      type: list
    instructions:
      type: list
- id: interface
  description: A material producer or consumer surface whose compatibility or ownership affects the requested outcome.
  stage: architecture
  required_any:
  - - surface
  statuses:
  - draft
  - active
  - changed
  - deprecated
  - superseded
  initial_status: active
  fields:
    kind:
      type: string
      required: true
    surface:
      type: string
      required: true
    compatibility:
      type: string
      required: true
    consumers:
      type: list
- id: data_model
  description: A durable data, persistence, schema, or serialization shape whose ownership or compatibility is material.
  stage: architecture
  required_any:
  - - shape
  statuses:
  - draft
  - active
  - changed
  - deprecated
  - superseded
  initial_status: active
  fields:
    owner:
      type: string
      required: true
    storage:
      type: string
    shape:
      type: string
      required: true
    compatibility_constraints:
      type: list
- id: contract
  description: An observable acceptance, compatibility, safety, or behavioral invariant with an enforcement point and failure meaning.
  stage: contracts
  required_any:
  - - invariant
  statuses:
  - draft
  - active
  - satisfied
  - violated
  - superseded
  initial_status: active
  fields:
    invariant:
      type: string
      required: true
    enforcement_point:
      type: string
      required: true
    failure_meaning:
      type: string
      required: true
    observability:
      type: string
- id: flow
  description: An ordered user or system journey needed to understand behavior or prove cross-boundary wiring.
  stage: architecture
  required_any:
  - - intent
  statuses:
  - draft
  - active
  - changed
  - superseded
  initial_status: active
  fields:
    intent:
      type: string
      required: true
    entrypoint:
      type: string
      required: true
    exit_condition:
      type: string
      required: true
    ordered_steps:
      type: list
      required: true
- id: defect
  description: A causal bug record that preserves expected and observed behavior, a focused diagnostic seam, and independently reviewed root-cause evidence before change planning.
  stage: design
  required_any:
  - - expected_behavior
  statuses:
  - unresolved
  - diagnosed
  - superseded
  initial_status: unresolved
  compiler_owned_fields:
  - status
  fields:
    expected_behavior:
      type: string
      required: true
    observed_behavior:
      type: string
      required: true
    reproduction_signal:
      type: string
      required: true
      description: Exact reproduction, observation, or honest explanation of why safe reproduction is unavailable.
    root_cause:
      type: string
    causal_chain:
      type: list
    ruled_out_alternatives:
      type: list
    impact:
      type: string
    environment:
      type: string
- id: decision
  description: A consequential approved choice with explicit options, rationale, and reversibility; only initialization may create one.
  stage: design
  required_any:
  - - question
  statuses:
  - open
  - accepted
  - superseded
  initial_status: accepted
  compiler_owned_fields:
  - status
  fields:
    kind:
      type: string
      required: true
      enum:
      - design
      - risk_acceptance
      - review_authority
    question:
      type: string
      required: true
    options:
      type: list
      required: true
    choice:
      type: string
      required: true
      description: The human-approved selection already present before post-approval validation.
    rationale:
      type: string
      required: true
    reversibility:
      type: string
      required: true
- id: change
  description: One cohesive vertical behavior slice that a reviewer can approve as a single claim and one evidence packet can prove.
  stage: implementation
  required_any:
  - - target_state
  statuses:
  - planned
  - implemented
  - superseded
  initial_status: planned
  compiler_owned_fields:
  - status
  fields:
    approval_claim:
      type: string
      required: true
      description: One sentence stating the exact cohesive outcome a reviewer is being asked to approve.
    current_state:
      type: string
      required: true
    target_state:
      type: string
      required: true
    owned_paths:
      type: list
      required: true
      items:
        type: path
        required: true
      description: Exact project-root-relative production files or directories this bounded change may modify.
    blast_radius:
      type: string
      required: true
    commit_type:
      type: string
      required: true
    risk_tier:
      type: string
      required: true
      enum:
      - routine
      - elevated
      - critical
    risk_factors:
      type: list
      required: true
      description: Concrete boundary, state, compatibility, security, operational, or reversibility factors supporting the tier.
    recovery_plan:
      type: list
      description: Required for critical work; name rollback or roll-forward controls and the trigger for using them.
    proof_strategy:
      type: string
      required: true
      enum:
      - red_green
      - characterization
      - current_verification
      description: Workflow-routing metadata only. Use red_green for honestly missing behavior, characterization for behavior that must be preserved, and current_verification only when an existing proof already exercises the bounded outcome. The linked proof node is the sole executable and evidence authority.
- id: migration
  description: A compatibility-aware transition between old and new states with explicit safety and rollback behavior.
  stage: implementation
  required_any:
  - - forward_plan
  statuses:
  - planned
  - complete
  - rolled_back
  - superseded
  initial_status: planned
  compiler_owned_fields:
  - status
  fields:
    forward_plan:
      type: list
      required: true
    owned_paths:
      type: list
      required: true
      items:
        type: path
        required: true
      description: Exact project-root-relative production files or directories this migration may modify.
    compatibility_window:
      type: string
      required: true
    rollback_plan:
      type: list
      required: true
    data_safety:
      type: string
    proof_strategy:
      type: string
      required: true
      enum:
      - red_green
      - characterization
      - current_verification
      description: Workflow-routing metadata only; linked proof nodes are the sole executable and evidence authority.
- id: risk
  description: A concrete material failure scenario with one explicit structural treatment and residual exposure.
  stage: assurance
  required_any:
  - - scenario
  statuses:
  - active
  - superseded
  initial_status: active
  compiler_owned_fields:
  - status
  fields:
    scenario:
      type: string
      required: true
    impact:
      type: string
      required: true
    likelihood:
      type: string
      required: true
    detection:
      type: string
      required: true
    treatment:
      type: string
      required: true
      enum:
      - mitigate
      - accept
    treatment_rationale:
      type: string
      required: true
    residual_risk:
      type: string
      required: true
- id: proof
  description: A reproducible verification obligation whose compiler-bound command establishes one focused or boundary claim with current evidence.
  stage: assurance
  required_any:
  - - claim
  statuses:
  - planned
  - prepared
  - passing
  - superseded
  initial_status: planned
  compiler_owned_fields:
  - status
  fields:
    purpose:
      type: string
      required: true
      enum:
      - focused
      - boundary
    baseline_check_id:
      type: string
      required: true
      enum:
      - proof-expected-red
      - proof-current-baseline
      description: Selects the honest pre-change outcome for this proof without forcing every linked boundary proof red.
    claim:
      type: string
      required: true
    method:
      type: string
      required: true
    command:
      type: list
      required: true
      items:
        type: string
        required: true
      description: 'Sole executable authority: one exact argv array used for compiler-bound baseline and promotion evidence; never a shell command string or multiple commands.'
    source_paths:
      type: list
      required: true
      items:
        type: path
        required: true
      disjoint_from: spec.covered_paths
      description: 'Exact repository proof, test, or harness source files whose current bytes are causal evidence. These paths must be authority-disjoint from covered_paths: equality and either ancestor/descendant direction are rejected. Independently preparation-managed diagnostic, risk-boundary, red-green, and characterization proofs require pairwise physically disjoint source files and must also be disjoint from current-verification proof sources; named tests or describe blocks in one file are one compiler authority boundary, not distinct source paths. Include every repository-local executable or script named by command; external tools resolved from PATH are not project source paths.'
    covered_paths:
      type: list
      required: true
      items:
        type: path
        required: true
      description: Exact product paths whose behavior the proof claims to exercise and whose current bytes the proof may read; these paths never grant write authority. This list is the canonical union of every oracle case's seam_paths, plus only additional product paths the proof genuinely exercises.
    support_paths:
      type: list
      items:
        type: path
        required: true
      description: Exact existing read-only repository files needed to construct and execute the proof honestly but not claimed as product coverage, such as the owning package manifest, test-runner configuration, TypeScript configuration, setup file, or one established neighboring test pattern. These paths grant no write authority and must never be used to smuggle additional product scope into the proof.
    oracle_cases:
      type: list
      required: true
      unique_by: id
      description: One or more explicit condition-to-production-oracle contracts. Every invoked production seam must have a case, and every seam_path must resolve to the same normalized project-relative path identity present in covered_paths before any proof ticket can dispatch.
      items:
        type: object
        required: true
        description: Closed oracle-case object with required id, condition, claim, production_seam, seam_paths, action, and assertions; environment and ordered recipe are optional only when immaterial.
        additional_properties: false
        properties:
          id:
            type: string
            required: true
            pattern: ^[a-z][a-z0-9_-]*$
            description: Stable short identifier unique within this proof.
          condition:
            type: string
            required: true
            description: Exact precondition, branch, input state, or failure condition exercised by this case.
          claim:
            type: string
            required: true
            description: The bounded observable behavior this case establishes.
          production_seam:
            type: string
            required: true
            description: The callable production boundary or real consumer invoked; never a test-local reimplementation of production logic.
          seam_paths:
            type: list
            required: true
            items:
              type: path
              required: true
            subset_of: spec.covered_paths
            description: Exact project-root-relative production files needed to inspect and invoke this case's production seam. Every entry must resolve to the same normalized project-relative path identity present in proof.covered_paths.
          action:
            type: string
            required: true
            description: The concrete stimulus or invocation performed against the production seam.
          assertions:
            type: list
            required: true
            items:
              type: string
              required: true
            description: Positive and material negative observations that would fail if the bounded behavior broke.
          environment:
            type: string
            description: Optional material runtime, fixture, package, or containment assumptions for this case.
          recipe:
            type: list
            items:
              type: string
              required: true
            description: Optional ordered recipe when the action needs multiple precise setup or invocation steps.
    working_directory:
      type: path
      required: true
      description: Project-root-relative contained working directory in which the exact argv executes.
    layer:
      type: string
      required: true
      enum:
      - unit
      - component
      - contract
      - integration
      - end_to_end
      - static
    conditions:
      type: list
      required: true
    expected_signal:
      type: string
      required: true
    why:
      type: string
      required: true
    not_proven:
      type: list
      required: true
    required_artifacts:
      type: list
    freshness_inputs:
      type: list
- id: delivery
  description: The exact reviewed candidate graph package assembled before target synchronization, composed verification, and promotion.
  stage: delivery
  required_any:
  - - target_branch
  statuses:
  - assembling
  - candidate_ready
  - superseded
  initial_status: assembling
  compiler_owned_fields:
  - status
  - spec.target_branch
  agent_visible_compiler_owned_fields:
  - spec.target_branch
  compiler_field_sources:
    spec.target_branch: run.git.target.ref
  fields:
    target_branch:
      type: string
      required: true
    summary:
      type: string
      required: true
    unresolved_risks:
      type: list
    external_refs:
      type: list
- id: improvement_target
  description: A discrete slice of the objective's domain that a continuous-improvement run must improve by exploring alternatives, selecting the best, and implementing it. Not a repository ownership boundary (that is `system`); this is a problem-domain decomposition unit.
  stage: design
  required_any:
  - - improvement_outcome
  statuses:
  - open
  - resolved
  - superseded
  initial_status: open
  compiler_owned_fields:
  - status
  fields:
    improvement_outcome:
      type: string
      required: true
      description: The observable improvement this slice must achieve before the run is complete.
    domain_slice:
      type: string
      required: true
      description: The bounded part of the objective's domain this target owns.
    slice_paths:
      type: list
      required: true
      description: The exact repository paths this target's alternatives may be prototyped within and its winner implemented in.
      items:
        type: path
        required: true
    resolution_meaning:
      type: string
      description: What "resolved" concretely means for this slice.
- id: selection_criteria
  description: The explicit decision rule that defines what "best" means for one improvement target; every candidate approach for that target is judged against exactly this set.
  stage: design
  required_any:
  - - criteria
  statuses:
  - active
  - superseded
  initial_status: active
  fields:
    criteria:
      type: list
      required: true
      description: One or more named criteria a winning approach must be evaluated against.
    decision_rule:
      type: string
      required: true
      description: How the criteria combine into a single ranking (for example weighted score, or must-pass gates then weighted factors).
- id: candidate_approach
  description: One alternative implementation for an improvement target, carried far enough to be prototyped, proven with executable evidence, and evaluated against the target's criteria.
  stage: design
  required_any:
  - - approach
  statuses:
  - proposed
  - prototyped
  - evaluated
  - selected
  - rejected
  - superseded
  initial_status: proposed
  compiler_owned_fields:
  - status
  fields:
    approach:
      type: string
      required: true
      description: One-sentence description of this alternative implementation.
    hypothesis:
      type: string
      required: true
      description: The expected advantage this approach is being explored to test.
    key_tradeoffs:
      type: list
      description: Known costs or limits of this approach relative to its siblings.
- id: evaluation
  description: The evidence-backed assessment of exactly one candidate approach against its target's selection criteria, citing the approach's prototype proof as evidence.
  stage: assurance
  required_any:
  - - verdict
  statuses:
  - recorded
  - superseded
  initial_status: recorded
  fields:
    verdict:
      type: string
      required: true
      description: Summary judgment of this approach against the criteria.
    scores:
      type: list
      required: true
      description: One scored entry per criterion in the governing selection_criteria, each citing its evidence.
    residual_concerns:
      type: list
- id: selection
  description: The approved choice of one candidate approach as the adopted winner for one improvement target, justified against the criteria and the recorded evaluations.
  stage: design
  required_any:
  - - rationale
  statuses:
  - proposed
  - accepted
  - superseded
  initial_status: proposed
  compiler_owned_fields:
  - status
  fields:
    rationale:
      type: string
      required: true
      description: Why the selected approach wins against every sibling under the decision rule.
    rejected_rationale:
      type: list
      required: true
      description: One entry per non-selected active approach stating why it lost.
    reversibility:
      type: string
      description: How reversible adopting this approach is.
