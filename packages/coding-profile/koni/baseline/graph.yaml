queries:
- id: objectives
  node_types:
  - objective
  status_excluding:
  - satisfied
  - superseded
- id: active_systems
  node_types:
  - system
  status_excluding:
  - superseded
- id: contract_required_systems
  node_types:
  - system
  status_excluding:
  - superseded
  where:
    op: field_equals
    subject: $node
    field: spec.contract_required
    value: true
- id: active_contracts
  node_types:
  - contract
  status_excluding:
  - violated
  - superseded
- id: active_defects
  node_types:
  - defect
  status_excluding:
  - superseded
- id: diagnosed_defects
  node_types:
  - defect
  statuses:
  - diagnosed
  where:
    all:
    - op: field_present
      subject: $node
      field: spec.root_cause
    - op: field_present
      subject: $node
      field: spec.causal_chain
    - op: field_present
      subject: $node
      field: spec.ruled_out_alternatives
    - exists:
        intersection:
        - $node
        - grounded_defects
    - for_all:
        select:
          intersection:
          - traverse:
              from: $node
              relation: verified_by
              max_depth: 1
              node_types:
              - proof
          - diagnostic_proofs
        bind: reviewed_diagnostic_proof
        satisfies:
          op: proof_preparation_current
          subject: $reviewed_diagnostic_proof
          check: baseline-proof-set
          preparation_operation: assurance.proof.prepare
          preparation_targets:
            union:
            - $reviewed_diagnostic_proof
            - traverse:
                from: $reviewed_diagnostic_proof
                relation: verifies
                max_depth: 1
                node_types:
                - risk
- id: open_decisions
  node_types:
  - decision
  statuses:
  - open
- id: active_changes
  node_types:
  - change
  status_excluding:
  - superseded
- id: planned_changes
  node_types:
  - change
  statuses:
  - planned
- id: implemented_changes
  node_types:
  - change
  statuses:
  - implemented
- id: active_migrations
  node_types:
  - migration
  status_excluding:
  - rolled_back
  - superseded
- id: planned_migrations
  node_types:
  - migration
  statuses:
  - planned
- id: complete_migrations
  node_types:
  - migration
  statuses:
  - complete
- id: active_risks
  node_types:
  - risk
  statuses:
  - active
- id: active_proofs
  node_types:
  - proof
  status_excluding:
  - superseded
- id: active_focused_proofs
  node_types:
  - proof
