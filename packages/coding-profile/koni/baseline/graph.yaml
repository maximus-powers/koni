- id: structurally_valid_risks
  select: active_risks
  where:
    any:
    - all:
      - op: field_equals
        subject: $node
        field: spec.treatment
        value: mitigate
      - op: edge_count
        subject: $node
        relation: accepted_by
        exact: 0
      - exists:
          intersection:
          - traverse:
              from: $node
              relation: mitigated_by
              max_depth: 1
              node_types:
              - change
              - migration
          - eligible_mitigation_controls
      - op: set_relation
        left:
          traverse:
            from: $node
            relation: mitigated_by
            max_depth: 1
            node_types:
            - change
            - migration
        right:
          intersection:
          - traverse:
              from: $node
              relation: mitigated_by
              max_depth: 1
              node_types:
              - change
              - migration
          - eligible_mitigation_controls
        relation_kind: equal
      - for_all:
          select:
            traverse:
              from: $node
              relation: mitigated_by
              max_depth: 1
              node_types:
              - change
              - migration
          bind: mitigation_control
          satisfies:
            any:
            - all:
              - op: node_type_is
                subject: $mitigation_control
                value: change
              - exists:
                  intersection:
                  - traverse:
                      from: $mitigation_control
                      relation: realizes
                      max_depth: 1
                      node_types:
                      - objective
                  - traverse:
                      from:
                        traverse:
                          from: $node
                          relation: introduced_by
                          max_depth: 1
                          node_types:
                          - change
                      relation: realizes
                      max_depth: 1
                      node_types:
                      - objective
            - all:
              - op: node_type_is
                subject: $mitigation_control
                value: migration
              - exists:
                  intersection:
                  - traverse:
                      from: $node
                      relation: introduced_by
                      max_depth: 1
                      node_types:
                      - change
                  - traverse:
                      from: $mitigation_control
                      relation: requires
                      direction: incoming
                      max_depth: 1
                      node_types:
                      - change
      - exists:
          intersection:
          - traverse:
              from: $node
              relation: verified_by
              max_depth: 1
              node_types:
              - proof
          - risk_boundary_proofs
    - all:
      - op: field_equals
        subject: $node
        field: spec.treatment
        value: accept
      - op: edge_count
        subject: $node
        relation: mitigated_by
        exact: 0
      - op: edge_count
        subject: $node
        relation: accepted_by
        exact: 1
      - exists:
          intersection:
          - traverse:
              from: $node
              relation: verified_by
              max_depth: 1
              node_types:
              - proof
          - risk_boundary_proofs
      - for_all:
          select:
            traverse:
              from: $node
              relation: accepted_by
              max_depth: 1
              node_types:
              - decision
          bind: acceptance_decision
          satisfies:
            all:
            - op: field_in
              subject: $acceptance_decision
              field: status
              values:
              - open
              - accepted
            - op: field_equals
              subject: $acceptance_decision
              field: spec.kind
              value: risk_acceptance
            - exists:
                intersection:
                - $node
                - traverse:
                    from: $acceptance_decision
                    relation: concerns
                    max_depth: 1
                    node_types:
                    - risk
