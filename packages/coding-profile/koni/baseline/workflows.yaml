schema_version: '3.0'
module:
  id: software.workflows
  version: 0.6.0
workflows:
- id: architecture-map
  version: 2.0.0
  applies_to:
  - map-architecture
  review_failure_reopen_from: map-affected-boundary
  review_rework_limit: 2
  steps:
  - id: map-affected-boundary
    agent: architecture-mapper
    graph_mutation: required
    write_paths: []
    expected_output: Smallest repository-grounded affected system plus only material canonical interface, data, contract, and flow facts
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - map-affected-boundary
    write_paths: []
    expected_output: Independent review of repository grounding, boundary necessity, canonical relationships, and speculative-model avoidance
    validation_action: review
- id: contract-design
  version: 2.0.0
  applies_to:
  - specify-contracts
  review_failure_reopen_from: specify-material-contract
  review_rework_limit: 2
  steps:
  - id: specify-material-contract
    agent: contract-designer
    graph_mutation: required
    write_paths: []
    expected_output: Fewest observable invariants needed for the explicitly contract-requiring boundary, linked through canonical relationships
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - specify-material-contract
    write_paths: []
    expected_output: Independent review of materiality, observability, compatibility, enforcement, and failure meaning
    validation_action: review
- id: change-design
  version: 2.0.0
  applies_to:
  - plan-change
  review_failure_reopen_from: plan-vertical-change
  review_rework_limit: 2
  steps:
  - id: plan-vertical-change
    agent: change-designer
    graph_mutation: required
    write_paths: []
    expected_output: Fewest one-sentence vertical change claims with exact scope, honest baseline strategy, adaptive proof purposes, causal defects, explicit risk tier, and structurally legal treatment
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - plan-vertical-change
    write_paths: []
    expected_output: Independent feasibility, approval-claim, proof-oracle, risk-tier, causal-defect, dependency, and scope review
    validation_action: review
- id: defect-grounding
  version: 1.0.0
  applies_to:
  - ground-defect
  review_failure_reopen_from: ground-diagnostic-seam
  review_rework_limit: 2
  steps:
  - id: ground-diagnostic-seam
    agent: change-designer
    graph_mutation: required
    write_paths: []
    expected_output: Honest unresolved defect when required plus exactly one focused diagnostic proof per uncovered active defect, or a zero-mutation report naming every conflicting proof ID and requesting human-authorized oracle selection; no speculative change or product edit
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - ground-diagnostic-seam
    write_paths: []
    expected_output: Independent review of expected versus observed behavior, reproducibility, diagnostic seam relevance, exact proof ownership, absence of speculative root cause, and fail-closed handling of duplicate oracles
    validation_action: review
- id: proof-preparation
  version: 2.0.0
  applies_to:
  - prepare-proof
  review_failure_reopen_from: author-historical-baseline
  review_rework_limit: 2
  steps:
  - id: author-historical-baseline
    agent: implementer
    graph_mutation: forbidden
    read_paths:
    - select:
        intersection:
        - $target
        - active_proofs
      field: spec.source_paths
    - select:
        intersection:
        - $target
        - active_proofs
      field: spec.covered_paths
    - select:
        intersection:
        - $target
        - active_proofs
      field: spec.support_paths
    write_paths:
    - select:
        intersection:
        - $target
        - active_proofs
      field: spec.source_paths
    expected_output: Minimal diagnostic, risk-boundary, red-green, or characterization proof source plus one independently reachable historical assertion path for every structured production seam and real consumer, exact legacy identities, an honest compiler-recorded baseline with no raw setup failure, exact seam paths readable through covered_paths, exact test-environment evidence readable through support_paths, and all covered product bytes unchanged
    checks:
    - baseline-proof-set
    required_receipts:
    - proof_baseline_set
    validation_action: compile-ticket
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - author-historical-baseline
    write_paths: []
    expected_output: Independent oracle-completeness review of every condition, claim, production seam and consumer route, exact covered seam path, action, assertion, environment/recipe, expected signal, scope, and proof source bound to the preparation-time historical receipt before any linked product implementation becomes eligible
    validation_action: review
- id: defect-diagnosis
  version: 2.0.0
  applies_to:
  - diagnose-defect
  review_failure_reopen_from: diagnose-cause
  review_rework_limit: 2
  steps:
  - id: diagnose-cause
    agent: change-designer
    graph_mutation: required
    read_paths:
    - select:
        intersection:
        - $target
        - diagnostic_proofs
      field: spec.source_paths
    - select:
        intersection:
        - $target
        - diagnostic_proofs
      field: spec.covered_paths
    write_paths: []
    expected_output: Evidence-backed first invalid state, root cause, causal chain, and ruled-out alternatives from the prepared diagnostic proof without product or proof-source modification
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - diagnose-cause
    write_paths: []
    expected_output: Independent causal diagnosis review that rejects symptoms, speculation, and cleanup expansion; on pass the compiler stamps only the defect diagnosed
    validation_action: review
- id: risk-treatment
  version: 1.0.0
