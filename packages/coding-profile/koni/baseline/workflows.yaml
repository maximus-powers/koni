  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - repair-treatment
    write_paths: []
    expected_output: Independent structural treatment review that rejects invented product scope or residual-risk authority
    validation_action: review
- id: decision-resolution
  version: 2.0.0
  applies_to:
  - resolve-decision
  review_failure_reopen_from: validate-approved-choice
  review_rework_limit: 2
  steps:
  - id: validate-approved-choice
    agent: change-designer
    graph_mutation: forbidden
    write_paths: []
    expected_output: Evidence-backed validation of the already populated approved-seed choice, rationale, alternatives, and reversibility with no graph delta
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - validate-approved-choice
    write_paths: []
    expected_output: Independent validation that stamps only the unchanged approved decision and fails closed on new acceptance authority
    validation_action: review
- id: red-green-implementation
  version: 6.0.0
  applies_to:
  - implement-change
  - implement-migration
  review_rework_limit: 2
  review_failure_routes:
    ticket_rework:
      disposition: reopen
      description: The prepared oracle remains valid and every finding is correctable inside the product-only implement step.
      reopen_from: implement
    upstream_proof:
      disposition: block
      description: The prepared proof oracle or its modeled consumer coverage is incomplete, stale, or otherwise invalid outside product-write authority.
      recovery: replan_from_clean_integration
      recovery_instructions: Preserve the rejected product candidate, replan and independently prepare the corrected oracle from clean integration state, then issue fresh implementation work only after that preparation passes; never re-prepare against the rejected candidate worktree.
  steps:
  - id: establish-baseline
    agent: implementer
    graph_mutation: forbidden
    read_paths:
    - select: $target
      field: spec.owned_paths
    - select:
        traverse:
          from: $target
          relation: verified_by
          max_depth: 1
          node_types:
          - proof
      field: spec.source_paths
    - select:
        traverse:
          from: $target
          relation: verified_by
          max_depth: 1
          node_types:
          - proof
      field: spec.covered_paths
    write_paths: []
    expected_output: Read-only confirmation that every independently prepared focused oracle still produces its honest configured historical result before product mutation
    checks:
    - baseline-proof-set
    required_receipts:
    - proof_baseline_set
    stop_conditions:
    - Do not modify production behavior before the compiler records the complete graph-selected baseline set
  - id: implement
    agent: implementer
    graph_mutation: forbidden
    depends_on:
    - establish-baseline
    preserve_source_paths_from: establish-baseline
    read_paths:
    - select: $target
      field: spec.owned_paths
    - select:
        traverse:
          from: $target
          relation: verified_by
          max_depth: 1
          node_types:
          - proof
      field: spec.source_paths
    - select:
        traverse:
          from: $target
          relation: verified_by
          max_depth: 1
          node_types:
          - proof
      field: spec.covered_paths
    write_paths:
    - select: $target
      field: spec.owned_paths
    expected_output: Smallest cohesive production delta followed by compiler-owned current focused promotion proof with baseline source bytes preserved
    checks:
    - promotion-proof-set
    required_receipts:
    - proof_set
  - id: review
    kind: review
    agent: reviewer
    graph_mutation: forbidden
    depends_on:
    - implement
    write_paths: []
    expected_output: Acceptance alignment, correctness, regression, scope, security, proof-oracle, and design review; on pass the compiler stamps the one implementation subject plus exactly its pinned active proofs, with standalone proof execution reserved for recovery
    validation_action: review
