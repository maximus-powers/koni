schema_version: "1.0"
id: medium
title: Medium
description: A standard multi-component change with one combined semantic plan, targeted questions, and safely parallel vertical slices.
instructions:
  planning: |
    Begin with a lightweight decision scan before broad repository inspection.
    Ask one focused batch of one to three questions early when the answers would
    materially change scope, architecture, safety, user experience, or
    verification. Never ask for facts the repository can answer. Give each
    question two to four choices, one recommendation, and the consequence of
    each choice. After those decisions are resolved, perform one consolidated
    investigation pass and produce the combined plan plus the smallest
    sufficient root-connected semantic graph seed. Seed objective.work_kind,
    affected repository-native systems, cohesive vertical changes, risk tiers
    and treatments, at least one primary focused single-subject proof per implementation claim,
    and risk-attached boundary proof only when the tier requires it. Give every
    proof structured oracle cases that bind real production seams and exact seam
    paths already present in read-only covered paths; never infer broader system
    ownership as proof scope. Materialize
    architecture and contracts only when they constrain behavior, ownership,
    compatibility, proof, or slice dependencies. Do not seed tickets, status,
    receipts, transient notes, or any compiler-owned field.
planning:
  session_scope: run
  graph_seed_stage: combined-plan
  max_repository_tool_calls: 24
  token_budget:
    metric: new_tokens
    limit: 240000
    synthesis_reserve: 60000
    on_exhausted: force_synthesis
profile:
  source: .codex/koni/profile.yaml
intake:
  fields:
    goal:
      label: Goal
      description: Describe the outcome Koni should deliver.
      type: text
      required: true
  order: [goal]
pipeline:
  stages:
    intake:
      kind: action
      title: Validate intake
      config: {compiler_owned: true, action: planning.intake}
    combined-plan:
      kind: planning
      title: Plan implementation, architecture, and risk
      config:
        persona: run-planner
        prompt: >-
          Produce one concise, implementation-ready plan and the smallest sufficient
          root-connected graph seed. Define the observable outcome, explicit non-goals,
          success signals, objective.work_kind, affected repository-native systems, and the
          fewest dependency-ordered vertical changes, each expressible as one approval
          sentence. Classify each change as routine, elevated, or critical from concrete risk
          factors; give every change a primary focused proof that verifies exactly that implementation
          subject, adding another only for a distinct remaining evidence gap. Only elevated or critical work introduces a material risk whose distinct
          boundary proof verifies the risk plus structural treatment. Choose an honest
          red_green, characterization, or current_verification baseline and exact
          repository-native argv. For every proof, bind condition and claim through structured
          oracle_cases to the callable production seam, exact seam_paths, action, assertions, and
          material environment/recipe; every seam path must resolve to the same normalized
          project-relative identity present in read-only covered_paths.
          Model interfaces, data, flows, contracts, migrations,
          decisions, and risks only when material. Use canonical edges and exact paths; never
          seed compiler-owned status, tickets, receipts, or implementation progress.
    approval:
      kind: approval
      title: Approve the plan
    initialize:
      kind: initialize
      title: Initialize the run
    orchestrate:
      kind: orchestration
      title: Execute compiled work
    target-sync:
      kind: target_sync
      title: Synchronize the target branch
    verification:
      kind: checkpoint
      title: Verify the completed run
      config: {checkpoint: verification}
    report:
      kind: action
      title: Compile final report
      config: {action: report, automatic: true}
    promotion:
      kind: promotion
      title: Merge the completed run
  order: [intake, combined-plan, approval, initialize, orchestrate, target-sync, verification, report, promotion]
questions:
  policy: high_impact_only
  default_scope: run
git:
  branch_template: "koni/runs/{{ run.slug }}-{{ run.short_id }}"
  ticket_branch_template: "koni/runs/{{ run.id }}/tickets/{{ ticket.id }}"
promotion:
  conflict_operation: resolve-target-integration
run_card:
  sections: [goal, pipeline, graph, tickets, checks, report]
agents:
  roles:
    planner: {model: gpt-5.6-sol, reasoning_effort: max}
    lead: {model: gpt-5.6-sol, reasoning_effort: xhigh}
    ticket_worker: {model: gpt-5.6-terra, reasoning_effort: high}
    reviewer: {model: gpt-5.6-sol, reasoning_effort: max}
  personas: {}
orchestration:
  auto_start: true
  max_parallel: 3
  compile_action: compile
  lead_action: spawn-lead
  report_action: report
