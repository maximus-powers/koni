schema_version: "1.0"
id: new-feature
title: New Feature
description: A Medium-derived capability preset centered on observable acceptance, a walking skeleton, and thin vertical slices.
extends: medium
overrides:
  - op: merge
    path: /intake/fields
    value:
      acceptance_examples:
        label: Acceptance examples
        description: Optional observable examples, edge cases, or user journeys that should work.
        type: text
      non_goals:
        label: Non-goals
        description: Optional behavior or follow-on work this run must deliberately leave out.
        type: text
  - op: replace
    path: /intake/order
    value: [goal, acceptance_examples, non_goals]
  - op: replace
    path: /instructions/planning
    value: |
      Seed objective.work_kind as new_feature. Start from the observable user or
      operator outcome, acceptance examples, important edge cases, and explicit
      non-goals. Inspect the existing journey, neighboring tests, naming, and
      repository-native boundary conventions before proposing an abstraction.
      For cross-boundary capability, plan a walking skeleton first and then the
      fewest thin end-to-end slices that leave the repository working. Reuse the
      existing architecture; do not invent a generalized platform, extension
      point, or parallel abstraction for hypothetical future work. Give every
      slice a primary focused executable proof scoped to that implementation
      subject, adding another only for a distinct remaining evidence gap. Bind
      each proof's conditions and claims through structured oracle cases to the
      callable production seam and exact seam paths already present in read-only
      covered paths; never inherit other system-owned paths.
      Add a distinct boundary seam only through an introduced material risk for
      remaining wiring, compatibility, runtime, UI, data, or operational risk.
      Add rollout, observability, migration, documentation, and recovery work
      only when the capability materially changes them. Ask only for missing
      product decisions, and warn before approval if discovered scope belongs
      in the Small or Large envelope.
  - op: replace
    path: /pipeline/stages/combined-plan/config/prompt
    value: >-
      Plan a new capability and emit the smallest sufficient root-connected semantic seed.
      Set objective.work_kind to new_feature; encode the observable outcome, acceptance
      examples, edge cases, and non-goals; ground the affected repository-native system and
      existing journey; and model only material interfaces, data, flows, and contracts. For a
      cross-boundary feature, make the first dependent change a working skeleton, then use the
      fewest thin vertical slices with one approval claim each. Assign evidence-based risk tiers
      and structural treatments, choose honest strategy-specific baselines, and bind each change
      to a primary focused proof, adding another only for a distinct remaining evidence gap. Give
      every proof structured oracle_cases with the callable production seam, exact seam_paths,
      action, assertions, and material environment/recipe; every seam path must resolve to the same
      normalized project-relative identity present in read-only covered_paths. A genuinely necessary boundary proof verifies the introduced risk,
      not the change itself. Do not create speculative
      platforms or seed status, tickets, receipts, transient notes, or compiler-owned fields.
  - op: replace
    path: /orchestration/max_parallel
    value: 3
